name: Update Movies

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-movies
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh movie list
        run: python update_movies.py

      - name: Commit changes
        run: |
          if [ -n "$(git status --porcelain movies.json watches.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add movies.json watches.json
            git commit -m "chore: refresh movie list"
            git pull --rebase
            git push
          else
            echo "nothing changed"
          fi
